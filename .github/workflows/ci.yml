name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pest

  laravel:
    name: Laravel ${{ matrix.laravel }} · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '11.*', testbench: '9.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*' }
    defaults:
      run:
        working-directory: packages/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Use the core package from this repository
        run: |
          composer config repositories.core '{"type": "path", "url": "../core", "options": {"symlink": true}}'
          composer require "testpilot/core:@dev" "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/pest

  ui:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Built assets are committed
        run: git diff --exit-code -- ../packages/laravel/dist || (echo "Run 'npm run build' in ui/ and commit packages/laravel/dist" && exit 1)
